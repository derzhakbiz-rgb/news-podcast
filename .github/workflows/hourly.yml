# Поклади цей файл у репозиторій за шляхом: .github/workflows/hourly.yml
name: news-every-2h

on:
  schedule:
    - cron: "5 * * * *"   # запуск щогодини (UTC); справжня робота лише перед годиною ефіру, див. check
  workflow_dispatch:       # кнопка ручного запуску (публікує одразу, без очікування)

permissions:
  contents: write

concurrency:
  group: hourly-news
  cancel-in-progress: false

env:
  AIR_PARITY: "0"       # 0 = ефір о парних годинах за Києвом (14:00, 16:00...), 1 = о непарних (13:00, 15:00...)
  PUBLISH_MINUTE: "30"  # о котрій хвилині перед ефіром випуск з'являється в RSS (13:30 для ефіру о 14:00)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - id: slot
        run: |
          H=$((10#$(TZ=Europe/Kyiv date +%H)))
          NEXT=$(( (H + 1) % 24 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( NEXT % 2 )) -eq "$AIR_PARITY" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Київ зараз ${H} год, найближчий ефір о ${NEXT}:00"

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # Підтягуємо попередній стан сайту (гілка gh-pages). Перший раз її ще немає.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - run: |
          mkdir -p site
          rm -rf site/.git
          cp cover.jpg site/cover.jpg
          mkdir -p site/panel
          cp panel.html site/panel/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - id: bot
        run: python bot.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE || 'Години новин' }}
          WINDOW_MIN: ${{ vars.WINDOW_MIN || '120' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'gemini' }}
          TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}
          TTS_SPEED: ${{ vars.TTS_SPEED || '1.08' }}

      # Випуск готовий заздалегідь; чекаємо потрібної хвилини перед ефіром (лише для запусків за розкладом)
      - name: Дочекатися часу публікації
        if: steps.bot.outputs.published == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          M=$((10#$(TZ=Europe/Kyiv date +%M)))
          S=$((10#$(date +%S)))
          if [ "$M" -lt "$PUBLISH_MINUTE" ]; then
            sleep $(( (PUBLISH_MINUTE - M) * 60 - S ))
          fi

      # force_orphan: історія гілки не росте, лишається один останній коміт
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.bot.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
