# Поклади цей файл у репозиторій за шляхом: .github/workflows/hourly.yml
name: hourly-news

on:
  schedule:
    - cron: "5 * * * *"   # щогодини на 5-й хвилині (GitHub може запізнюватись)
  workflow_dispatch:       # кнопка ручного запуску для тесту

permissions:
  contents: write

concurrency:
  group: hourly-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Підтягуємо попередній стан сайту (гілка gh-pages). Перший раз її ще немає.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - run: |
          mkdir -p site
          rm -rf site/.git
          cp cover.jpg site/cover.jpg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE || 'Години новин' }}
          WINDOW_MIN: ${{ vars.WINDOW_MIN || '60' }}

      # force_orphan: історія гілки не росте, лишається один останній коміт
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
